name: Windows checks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_original_layout:
        description: Verify that the original resource layout fails
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.402
      - name: Build
        run: dotnet build WormsLandEditor.sln -c Release
      - name: Check formats, persistence, sessions and localization
        shell: pwsh
        run: |
          foreach ($check in @("LocalizationChecks", "PersistenceChecks", "PackageChecks", "EditorSessionChecks")) {
            dotnet run --project "tests/WormsLandEditor.$check/WormsLandEditor.$check.csproj" -c Release --no-build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify overlap regression is detected
        if: inputs.verify_original_layout || (github.event_name == 'push' && github.event.before == '5babbd13f6b216235b75489526812decd1a3b276')
        shell: pwsh
        run: |
          $path = "src/WormsLandEditor/MainForm.EditorTransitions.cs"
          $fixed = [IO.File]::ReadAllBytes($path)
          try {
            $baseline = git show "9d6e18ced6605e4ba39e0d7e096fc12595d26e42:$path"
            if ($LASTEXITCODE -ne 0) { throw "Could not read the baseline module." }
            [IO.File]::WriteAllLines($path, $baseline)
            $PSNativeCommandUseErrorActionPreference = $false
            dotnet run --project tests/WormsLandEditor.ResourceLayoutChecks/WormsLandEditor.ResourceLayoutChecks.csproj -c Release 2>&1 | Tee-Object -Variable output
            $code = $LASTEXITCODE
            if ($code -eq 0 -or ($output -join "`n") -notmatch "Resource cards must not overlap") {
              throw "The baseline did not fail with the expected resource-card overlap."
            }
            Write-Host "PASS baseline fails on overlapping resource cards."
            $global:LASTEXITCODE = 0
          } finally {
            [IO.File]::WriteAllBytes($path, $fixed)
          }
      - name: Check resource panel controls
        run: dotnet run --project tests/WormsLandEditor.ResourceLayoutChecks/WormsLandEditor.ResourceLayoutChecks.csproj -c Release
